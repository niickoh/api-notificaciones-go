openapi: 3.0.3
info:
  title: API de Notificaciones
  version: 1.0.0
  description: API minimal para enviar notificaciones de mail y WhatsApp.
servers:
  # relativo al openapi.yaml: funciona en localhost, en el dominio y bajo un prefijo de nginx
  - url: ./
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Destinatarios:
      type: array
      items:
        type: object
        required: [email]
        properties:
          email: {type: string, format: email, example: atleta@example.com}
          name: {type: string, example: Sofía}
    NotificationRequest:
      type: object
      required:
        - email_from
        - email_to
      properties:
        email_from:
          type: string
          format: email
        email_to:
          type: string
          format: email
        mensaje:
          type: string
        telefono:
          type: string
          example: +56912345678
        direccion:
          type: string
        nombres:
          type: string
        apellidos:
          type: string
        comuna:
          type: string
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          properties:
            message_id:
              type: string
            timestamp:
              type: string
              format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API operativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /mail/bienvenida:
    post:
      summary: Envía correo de bienvenida
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mail/contacto:
    post:
      summary: Formulario de contacto (plantilla contacto). Llega a CONTACT_EMAIL_TO
      description: Público (sin JWT), para visitantes de la landing. Limitado por IP a RATE_LIMIT_CONTACTO envíos por hora (5 por defecto). El correo del visitante va en el cuerpo del mensaje (sin Reply-To, para no caer en spam). También acepta /mail/contacto/.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: {type: string, example: Sofía Ramírez}
                email: {type: string, format: email, example: sofia@example.com}
                message: {type: string, example: "Hola, quiero una demo."}
                club: {type: string, example: UPAC}
                telefono: {type: string, example: +56 9 1234 5678}
                deportistas: {type: string, example: "30"}
      responses: &sphereResponses
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fallo en Mailjet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mail/aviso:
    post:
      summary: Aviso a atletas (plantilla aviso). Un correo personalizado por destinatario
      description: Acepta destinatarios (lista) o email + name sueltos. prioridad normal | importante | urgente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, mensaje]
              properties:
                destinatarios: {$ref: '#/components/schemas/Destinatarios'}
                email: {type: string, format: email}
                name: {type: string}
                titulo: {type: string, example: Cambio de horario}
                mensaje: {type: string, example: El jueves entrenamos a las 19:00.}
                prioridad: {type: string, enum: [normal, importante, urgente]}
                autor: {type: string, example: Coach Camila}
                equipo: {type: string, example: Galaxy}
                url: {type: string, example: https://dev.sportspherecenter.com/}
      responses: *sphereResponses
  /mail/evento:
    post:
      summary: Evento de calendario (plantilla evento). Un correo personalizado por destinatario
      description: Acepta destinatarios (lista) o email + name sueltos. estado nuevo | modificado | cancelado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, fecha_inicio]
              properties:
                destinatarios: {$ref: '#/components/schemas/Destinatarios'}
                email: {type: string, format: email}
                name: {type: string}
                titulo: {type: string, example: Entrenamiento técnico}
                tipo: {type: string, example: ENTRENAMIENTO}
                estado: {type: string, enum: [nuevo, modificado, cancelado]}
                fecha_inicio: {type: string, example: "2026-11-17T18:30:00"}
                fecha_fin: {type: string, example: "2026-11-17T20:30:00"}
                ubicacion: {type: string, example: Gimnasio UPAC}
                equipo: {type: string, example: Galaxy}
                descripcion: {type: string, example: Traer botella de agua.}
                url: {type: string, example: https://dev.sportspherecenter.com/}
      responses: *sphereResponses
  /mail/bienvenidaNew:
    post:
      summary: Usuario creado (plantilla usuario-creado) con sus datos de acceso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username]
              properties:
                email: {type: string, format: email, example: sofia@example.com}
                name: {type: string, example: Sofía}
                username: {type: string, example: sofia.r}
                password: {type: string, example: Temp2026!}
                rol: {type: string, example: Atleta}
                club: {type: string, example: UPAC All Stars}
                url: {type: string, description: "Opcional, por defecto PORTAL_URL"}
      responses: *sphereResponses
  /mail/asignacionEquipo:
    post:
      summary: Asignación a equipo (plantilla asignacion-equipo)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, equipo]
              properties:
                email: {type: string, format: email, example: sofia@example.com}
                name: {type: string, example: Sofía}
                equipo: {type: string, example: Galaxy}
                rol: {type: string, example: Atleta}
                entrenador: {type: string, example: Camila Rojas}
                club: {type: string, example: UPAC}
                color: {type: string, description: "Solo hex; si no, se usa #359FD8", example: '#E91E63'}
                url: {type: string, description: "Opcional, por defecto PORTAL_URL"}
      responses: *sphereResponses
  /mail/contacto-upac:
    post:
      summary: Envía correo de contacto UPAC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Correo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /whatsapp/bienvenida:
    post:
      summary: Envía mensaje de bienvenida por WhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NotificationRequest'
              required:
                - telefono
      responses:
        '200':
          description: Mensaje enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /whatsapp/contacto:
    post:
      summary: Envía mensaje de contacto por WhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NotificationRequest'
              required:
                - telefono
      responses:
        '200':
          description: Mensaje enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /whatsapp/contacto-upac:
    post:
      summary: Envía mensaje de contacto UPAC por WhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NotificationRequest'
              required:
                - telefono
      responses:
        '200':
          description: Mensaje enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: JWT inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
