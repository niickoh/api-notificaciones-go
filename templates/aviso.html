{{template "head" .}}
              <p style="margin:0 0 16px;">Hola <strong>{{.NOMBRE}}</strong>,</p>
              <p style="margin:0 0 18px;">{{if .AUTOR}}<strong>{{.AUTOR}}</strong> publicó{{else}}Hay{{end}} un nuevo aviso{{if .EQUIPO}} para <strong>{{.EQUIPO}}</strong>{{end}}:</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="border:1px solid #cce9f7; border-left:5px solid {{.PRIORIDAD_COLOR}}; border-radius:10px;">
                <tr>
                  <td style="padding:18px 20px;">
                    <span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:#ffffff; background:{{.PRIORIDAD_COLOR}};">{{.PRIORIDAD}}</span>
                    <div style="margin:10px 0 8px; font-size:18px; font-weight:bold; color:#0f2a3d;">{{.TITULO}}</div>
                    <div style="white-space:pre-wrap;">{{.MENSAJE}}</div>
                  </td>
                </tr>
              </table>
{{if .URL}}{{template "boton" .}}{{end}}
{{template "foot" .}}
